[project]
name = "odin"
version = "0.1.0"
description = "ODIN — Agentic self-debugging framework with Adaptive RAG"
readme = "README.md"
authors = [
    { name = "Sneha Gusain", email = "snehag2864@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "chromadb>=0.5.0",
    "fastapi>=0.115.0",
    "google-genai>=1.0.0",
    "langgraph>=0.2.0",
    "matplotlib>=3.8.0",
    "pandas>=2.0.0",
    "pydantic>=2.0.0",
    "python-dotenv>=1.0.0",
    "sentence-transformers>=2.0.0",
    "streamlit>=1.38.0",
    "textual>=0.80.0",
    "uvicorn>=0.30.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[project.scripts]
odin = "odin.main:main"
odin-api = "odin.api:main"
odin-ingest = "odin.rag.ingest:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
